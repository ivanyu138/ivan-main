<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Maple Heights</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="game"></canvas>

    <div id="ui">
      <div id="hud">
        <div class="row"><span id="lvl">LV 1</span><span id="money">$0</span><span id="clock">09:00</span></div>
        <div class="bar hp"><div class="fill"></div><span>HP</span></div>
        <div class="bar st"><div class="fill"></div><span>STA</span></div>
        <div class="bar xp"><div class="fill"></div><span>XP</span></div>
      </div>
      <canvas id="minimap" width="180" height="180"></canvas>
      <div id="objective"></div>
      <div id="toasts"></div>
      <div id="prompt"></div>
      <div id="hotbar"></div>
      <div id="speedo"></div>
      <div id="dialog"><div class="name"></div><div class="text"></div><div class="opts"></div></div>
      <div id="panel"></div>
      <div id="dead">KNOCKED OUT</div>
    </div>

    <div id="title">
      <h1>MAPLE HEIGHTS</h1>
      <p class="tag">a tiny open-world RPG</p>
      <div class="buttons">
        <button id="btn-play">PLAY</button>
        <button id="btn-new">NEW GAME</button>
        <button id="btn-cat">CHANGE CAT</button>
      </div>
      <div class="controls"></div>
    </div>

    <div id="select">
      <h2>CHOOSE YOUR CAT</h2>
      <div class="bottom">
        <div class="cards"></div>
        <button id="btn-start">START</button>
        <small>1-3 or arrow keys to choose &middot; Enter to start</small>
      </div>
    </div>

    <div id="pause">
      <div class="menu">
        <h2>PAUSED</h2>
        <div class="buttons">
          <button id="btn-resume"><span class="k">1</span> RESUME</button>
          <button id="btn-pause-cat"><span class="k">2</span> CHANGE CAT</button>
        </div>
        <div class="controls"></div>
        <small>Esc or ` to resume</small>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
